name: copr-nightly-4x

# Private nightly for the newest MicroShift 4.y release branch.
#
# This is NOT part of the upstream pipeline. It exists because the upstream
# nightly (copr-nightly.yaml) only builds what @microshift-io publishes, and
# the 4.y stream needs a COPR project that only a project admin can create.
# Everything here pushes into a COPR project owned by the fork owner instead,
# reusing the very same make targets as the upstream workflow.
#
# Required repository configuration:
#   secret COPR_CONFIG     - contents of ~/.config/copr (https://copr.fedorainfracloud.org/api/)
#   variable COPR_REPO_NAME - e.g. 'myfasuser/microshift-nightly-4x'

on:
  schedule:
    # An hour after the upstream nightly, so a fresh OKD payload of the day is
    # already visible.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ushift-gitref:
        description: "MicroShift git ref. Empty: newest release-4.y that has an OKD payload."
        default: ""
        type: string
      okd-version-stream:
        description: "OKD x.y stream. Empty: derived from the git ref."
        default: ""
        type: string
      force:
        description: "Build even if this commit and OKD payload were already built."
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Resolve which 4.y to build. The newest release branch is not necessarily
  # buildable: openshift/microshift branches a release before the OKD payload
  # of that stream exists, and both architectures are needed because
  # srpm.Containerfile resolves the cross-arch tag of the same stream.
  setup:
    if: github.repository == 'mkocustos/microshift'
    runs-on: ubuntu-24.04
    outputs:
      ushift-gitref: ${{ steps.resolve.outputs.ushift-gitref }}
      okd-version-stream: ${{ steps.resolve.outputs.okd-version-stream }}
      okd-version-tag: ${{ steps.detect-okd-version.outputs.okd-version-tag }}
      should-build: ${{ steps.guard.outputs.should-build }}
    steps:
      - name: Check out MicroShift upstream repository
        uses: actions/checkout@v4
        with:
          # The guard dates the newest packaging commit, so it needs history
          # rather than the default single-commit checkout.
          fetch-depth: 0

      - name: Verify the COPR project is configured
        env:
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_REPO_NAME}" ]; then
            echo "ERROR: repository variable COPR_REPO_NAME is not set" >&2
            echo "       expected something like 'myfasuser/microshift-nightly-4x'" >&2
            exit 1
          fi
          echo "COPR project: ${COPR_REPO_NAME}"

      - name: Resolve the MicroShift release branch and OKD stream
        id: resolve
        shell: bash
        env:
          INPUT_GITREF: ${{ inputs.ushift-gitref }}
          INPUT_STREAM: ${{ inputs.okd-version-stream }}
        run: |
          set -euo pipefail
          sudo apt-get install -y jq

          gitref="${INPUT_GITREF:-}"
          stream="${INPUT_STREAM:-}"

          has_payload() {
            local xy="$1"
            ./src/okd/get_version.sh latest-amd64 "${xy}" >/dev/null 2>&1 && \
            ./src/okd/get_version.sh latest-arm64 "${xy}" >/dev/null 2>&1
          }

          if [ -z "${gitref}" ]; then
            # Highest minor first, so the build follows the release train on its own.
            mapfile -t branches < <(
              git ls-remote --heads https://github.com/openshift/microshift.git 'refs/heads/release-4.*' \
                | awk '{print $2}' | sed 's|refs/heads/||' | sort -t. -k2 -n -r)

            for branch in "${branches[@]}"; do
              xy="${branch#release-}"
              echo "Checking OKD payload for ${xy}"
              if has_payload "${xy}"; then
                gitref="${branch}"
                stream="${xy}"
                break
              fi
            done
          elif [ -z "${stream}" ] && [[ "${gitref}" =~ ^release-([0-9]+\.[0-9]+)$ ]]; then
            stream="${BASH_REMATCH[1]}"
          fi

          if [ -z "${gitref}" ] || [ -z "${stream}" ]; then
            echo "ERROR: no 4.y release branch with a matching OKD payload was found" >&2
            exit 1
          fi

          # The commit is what the duplicate-build guard keys on, so resolve it
          # here rather than letting a later job race against a new push.
          sha="$(git ls-remote https://github.com/openshift/microshift.git \
                   "refs/heads/${gitref}" | cut -f1)"
          if [ -z "${sha}" ]; then
            echo "ERROR: could not resolve the tip of ${gitref}" >&2
            exit 1
          fi

          echo "Building ${gitref} (${sha}) against OKD ${stream}"
          echo "ushift-gitref=${gitref}" >> "${GITHUB_OUTPUT}"
          echo "okd-version-stream=${stream}" >> "${GITHUB_OUTPUT}"
          echo "ushift-sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Detect OKD version tag
        id: detect-okd-version
        uses: ./.github/actions/okd-version
        with:
          # amd64 rather than the action's arm64 default. The self-built arm64
          # mirror never publishes GA tags for a branched stream - 4.22 ends
          # there at ec.16 (8 May 2026) - so the "prefer released tags" rule in
          # get_version.sh finds nothing and pins that old EC indefinitely.
          #
          # Only sound because this COPR project has x86_64 chroots exclusively:
          # no aarch64 RPM is ever produced whose single version string would
          # then name a payload it does not actually contain. Upstream must NOT
          # copy this - see microshift-io/microshift#237 for the proper fix.
          check-amd64: "true"
          stream: ${{ steps.resolve.outputs.okd-version-stream }}

      - name: Decide whether anything changed
        id: guard
        shell: bash
        env:
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
          USHIFT_SHA: ${{ steps.resolve.outputs.ushift-sha }}
          OKD_VERSION_TAG: ${{ steps.detect-okd-version.outputs.okd-version-tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${FORCE}" = "true" ]; then
            echo "Forced through workflow_dispatch."
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A release branch carries no build timestamp in its version, so the
          # same commit against the same payload produces the very same NVR.
          # Skip rather than push a duplicate build into COPR.
          owner="${COPR_REPO_NAME%%/*}"
          project="${COPR_REPO_NAME##*/}"
          # git rev-parse --short picks 7-10 characters depending on repository
          # size, so match the short sha as a substring instead of guessing it.
          needle_sha="_g${USHIFT_SHA:0:7}"
          needle_okd="_${OKD_VERSION_TAG//-/_}"

          # COPR reports the version NVR-style as "<version>-<rpm release>", so
          # the release suffix has to come off before matching the payload.
          last="$(curl -fsSL --retry 3 \
                    "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${owner}&projectname=${project}" \
                  | jq -r --arg sha "${needle_sha}" --arg okd "${needle_okd}" \
                      '[.items[]
                        | select(.state == "succeeded")
                        | select((((.source_package.version // "") | sub("-[0-9]+$"; "")) as $v
                                  | ($v | contains($sha)) and ($v | endswith($okd))))
                        | .submitted_on]
                       | if length == 0 then 0 else max end')"

          echo "Newest succeeded build matching *${needle_sha}* ending in ${needle_okd}: ${last}"
          if [ "${last}" -eq 0 ]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The NVR only encodes the upstream commit and the OKD payload. The
          # kindnet and topolvm assets, the spec files and the Containerfile all
          # live in THIS repo and are packaged into the same NVR, so a change to
          # them is invisible to the match above -- a kindnet digest bump was
          # silently skipped that way. Compare timestamps as well.
          src_ts="$(git log -1 --format=%ct -- src/ packaging/ Makefile)"
          if [ -n "${src_ts}" ] && [ "${src_ts}" -gt "${last}" ]; then
            echo "Packaging inputs changed at $(date -u -d "@${src_ts}" +%FT%TZ), after that build - rebuilding."
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Nothing changed since the last successful build - skipping."
            echo "should-build=false" >> "${GITHUB_OUTPUT}"
          fi

  # The repo configuration RPM that points at the OpenShift mirror. The CNI
  # plugins package of the upstream pipeline is deliberately skipped: it is
  # built for epel-10 only, and Fedora ships containernetworking-plugins itself.
  build-dependencies-rpm:
    needs: setup
    if: ${{ needs.setup.outputs.should-build == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out MicroShift upstream repository
        uses: actions/checkout@v4

      - name: Build dependencies RPM
        shell: bash
        env:
          COPR_CONFIG: |
            ${{ secrets.COPR_CONFIG }}
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
        run: |
          set -euo pipefail
          echo "${COPR_CONFIG}" > /tmp/copr-config

          make copr-dependencies \
            OKD_VERSION_TAG=${{ needs.setup.outputs.okd-version-tag }} \
            COPR_REPO_NAME="${COPR_REPO_NAME}" \
            COPR_CONFIG=/tmp/copr-config

  build-rpms:
    needs: setup
    if: ${{ needs.setup.outputs.should-build == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out MicroShift upstream repository
        uses: actions/checkout@v4

      - name: Build SRPM
        shell: bash
        env:
          USHIFT_GITREF: ${{ needs.setup.outputs.ushift-gitref }}
          OKD_VERSION_STREAM: ${{ needs.setup.outputs.okd-version-stream }}
        run: |
          set -euo pipefail
          make srpm \
            USHIFT_GITREF="${USHIFT_GITREF}" \
            OKD_VERSION_TAG=${{ needs.setup.outputs.okd-version-tag }} \
            OKD_VERSION_STREAM="${OKD_VERSION_STREAM}" \
            SRPM_WORKDIR=/mnt/srpm

      - name: Create copr-cli image and secret
        shell: bash
        env:
          COPR_CONFIG: |
            ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          echo "${COPR_CONFIG}" > /tmp/copr-config

          make copr-cli
          make copr-cfg-ensure-podman-secret COPR_CONFIG=/tmp/copr-config

      - name: Create COPR build
        shell: bash
        env:
          COPR_CONFIG: |
            ${{ secrets.COPR_CONFIG }}
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
        run: |
          set -euo pipefail
          echo "${COPR_CONFIG}" > /tmp/copr-config

          make copr-create-build \
            SRPM_WORKDIR=/mnt/srpm \
            COPR_REPO_NAME="${COPR_REPO_NAME}" \
            COPR_CONFIG=/tmp/copr-config

          make copr-watch-build \
            SRPM_WORKDIR=/mnt/srpm \
            COPR_REPO_NAME="${COPR_REPO_NAME}"

      - name: COPR - Regenerate RPM repo
        shell: bash
        env:
          COPR_CONFIG: |
            ${{ secrets.COPR_CONFIG }}
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
        run: |
          set -euo pipefail
          echo "${COPR_CONFIG}" > /tmp/copr-config

          make copr-regenerate-repos \
            COPR_CONFIG=/tmp/copr-config \
            COPR_REPO_NAME="${COPR_REPO_NAME}"

  # Consume the repository the way the target host does: enable it in a clean
  # Fedora container and let dnf resolve the whole package set. Dependency
  # breakage against the OpenShift mirror is the realistic failure mode here,
  # and it shows up before the host runs 'dnf upgrade'.
  verify-repo:
    needs: [setup, build-dependencies-rpm, build-rpms]
    # Runs on skip days too: it checks the published repository against the
    # OpenShift mirror, which is exactly when nothing was rebuilt.
    if: ${{ !cancelled() && needs.setup.result == 'success'
            && needs.build-rpms.result != 'failure'
            && needs.build-dependencies-rpm.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install the RPMs from COPR in a Fedora container
        shell: bash
        env:
          COPR_REPO_NAME: ${{ vars.COPR_REPO_NAME }}
          OKD_VERSION_STREAM: ${{ needs.setup.outputs.okd-version-stream }}
        run: |
          set -euo pipefail
          for release in 43 44; do
            echo "### Fedora ${release}"
            sudo podman run --rm \
              --env COPR_REPO_NAME="${COPR_REPO_NAME}" \
              --env OKD_VERSION_STREAM="${OKD_VERSION_STREAM}" \
              "quay.io/fedora/fedora:${release}" bash -euxo pipefail -c '
                dnf install -y dnf-plugins-core
                dnf copr enable -y "${COPR_REPO_NAME}"
                dnf install -y microshift-io-dependencies

                # The newest MicroShift in the repository must belong to the
                # stream that was just built, not to a leftover of another one.
                version="$(dnf repoquery --queryformat "%{version}\n" \
                              --disablerepo="*" --enablerepo="*microshift-nightly*" microshift \
                            | sort -V | tail -1)"
                echo "microshift in the repository: ${version}"
                [[ "${version}" == "${OKD_VERSION_STREAM}."* ]]

                # Resolve and download the full package set without running the
                # scriptlets, which need a real system.
                dnf install -y --downloadonly microshift microshift-greenboot microshift-selinux
              '
          done
